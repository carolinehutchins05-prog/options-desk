<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% if page.title and page.url != "/" %}{{ page.title }} &middot; {% endif %}{{ site.title }}</title>
<meta name="description" content="{{ page.description | default: site.description }}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<header class="site">
  <div class="wrap">
    <a class="brand" href="{{ '/' | relative_url }}">
      <span class="mark">OD</span>
      <span class="brandtext">Options Desk</span>
    </a>
    <nav>
      <a href="{{ '/methodology' | relative_url }}">Methodology</a>
      <a href="{{ '/research' | relative_url }}">Research</a>
      <a href="{{ '/revisions' | relative_url }}">Revisions</a>
      <a href="{{ '/archive' | relative_url }}">Daily log</a>
    </nav>
  </div>
</header>
<main id="main" class="wrap">
  {{ content }}
</main>
<footer class="site">
  <div class="wrap">
    <p><strong>Not investment advice.</strong> A personal research log. No position, account, or portfolio data is published here.</p>
    <p class="meta">Source on <a href="https://github.com/carolinehutchins05-prog/options-desk">GitHub</a>. Built and maintained by Caroline Hutchins.</p>
  </div>
</footer>
</body>
</html>
